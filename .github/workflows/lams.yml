name: LAMS

on:
  pull_request:
    branches: [<default_branch>]
  push:
    branches: [<default_branch>]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lams:
    runs-on: ubuntu-latest
    name: LAMS LookML Linter
    steps:
      - name: Checkout LookML
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install LAMS
        run: npm install -g @looker/look-at-me-sideways@5 js-yaml

      - name: Run LAMS
        run: lams --reporting=no --manifest=05_config/lams.yml --output=github-job-summary,lines
